name: Browser extension CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension-tests:
    name: eD2k extension tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: amule-org/amule
          # Keep fixture imports reproducible without building aMule in this job.
          ref: 2b7da2f83c80f87c24e605f430983f33ec0c82a8
          path: .amule-test-source
          sparse-checkout: |
            unittests/tests
            src/libs/ec/abstracts
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned browser and desktop test dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-x11 desktop-file-utils python3-gi python3-cryptography gir1.2-atspi-2.0 at-spi2-core libxtst6 xdg-utils libglib2.0-bin
      - name: Test optional application preflight and caller paths
        env:
          AMULE_SOURCE_DIR: ${{ github.workspace }}/.amule-test-source
        run: python3 tests/preflight.test.py
      - name: Test content script in real browser DOMs
        run: npm test
      - name: Test packaged extension, native consent and desktop handoff
        env:
          DEBUG: pw:browser
          XDG_UTILS_DEBUG_LEVEL: "2"
          # Ubuntu 24.04's legacy generic xdg-open mistakes digit-containing
          # schemes such as ed2k: for paths. Exercise its real GIO desktop route.
          XDG_CURRENT_DESKTOP: GNOME
        run: npm run test:smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ed2k-extension-test-evidence
          path: |
            /tmp/amule-ed2k-smoke.*/state/results.json
            /tmp/amule-ed2k-smoke.*/state/native-prompt.log
            /tmp/amule-ed2k-smoke.*/state/handler.jsonl
            /tmp/amule-ed2k-smoke.*/state/popup.png
            /tmp/amule-ed2k-smoke.*/state/help.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: ed2k-link-fixer
          path: dist/ed2k-link-fixer.zip
